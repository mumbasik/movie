<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Search</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: linear-gradient(135deg, #0d0d0e, #2e3035);
        padding: 40px;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 35px;
        width: 100%;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .dataCard {
        width: 420px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.08);

        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
        animation: fadeIn 0.5s ease;
        margin: 10px;
        transform: translateY(0);
      }

      h1 {
        color: #fff;
        margin-bottom: 20px;
        letter-spacing: 2px;
        font-size: 30px;
      }

      label {
        width: 100%;
        margin-top: 12px;
        color: #bfc3c7;
        font-weight: 500;
        font-size: 15px;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border-radius: 10px;
        border: 2px solid transparent;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 15px;
        transition: 0.3s;
      }

      input::placeholder {
        color: #d9d9d9;
      }

      input:focus,
      select:focus {
        border-color: #00eaff;
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 10px #00eaff;
      }

      button {
        width: 50%;
        padding: 12px;
        margin-top: 22px;
        border: none;
        border-radius: 12px;
        font-size: 17px;
        cursor: pointer;
        background: linear-gradient(135deg, #00d46f, #00a24a);
        color: #fff;
        transition: 0.3s ease;
        box-shadow: 0 0 12px rgba(0, 255, 140, 0.4);
      }

      button:hover {
        transform: scale(1.08);
        box-shadow: 0 0 15px rgba(0, 255, 140, 0.6);
      }

      .detailsBtn {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border-radius: 10px;
      }

      .detailsBtn:hover {
        box-shadow: 0 0 18px rgba(0, 153, 255, 0.7);
      }

      .showCard {
        width: 90%;
        max-width: 1000px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 15px;

        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      #result {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
      }

      .movie-card {
        width: 220px;
        padding: 15px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        transition: 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }

      .movie-card:hover {
        transform: translateY(-6px) scale(1.05);
      }

      .movie-card img {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border-radius: 12px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);

        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
        z-index: 999;
      }

      .detailCard {
        width: 80%;
        max-width: 750px;
        background: rgba(25, 25, 28, 0.9);
        border-radius: 18px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 25px rgba(182, 190, 190, 0.35);

        display: flex;
        flex-direction: row;
        gap: 20px;
        animation: zoomIn 0.35s ease;
        color: #fff;
      }

      .detailCard img {
        width: 230px;
        height: 340px;
        object-fit: cover;
        border-radius: 12px;
      }

      .detail-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .detail-content h2 {
        font-size: 26px;
        letter-spacing: 1px;
      }

      .detail-content p {
        font-size: 16px;
        opacity: 0.9;
      }

      .detailRow strong {
        color: #00eaff;
      }

      .closeDetail {
        margin-top: 10px;
        width: 140px;
        padding: 10px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ff5252, #d81818);
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255, 60, 60, 0.4);
        transition: 0.3s;
      }

      .closeDetail:hover {
        transform: scale(1.08);
        box-shadow: 0 0 20px rgba(255, 80, 80, 0.7);
      }

      @keyframes zoomIn {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .error {
        border: 2px solid #ff4d4d !important;
        box-shadow: 0 0 12px red !important;
        background: rgba(255, 100, 100, 0.15) !important;
      }

      .error-message {
        color: #ff4d4d;
        margin: 5px 0 0 2px;
        font-size: 14px;
        display: none;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
      }

      .modal-window {
        background: rgba(25, 25, 28, 0.9) !important;
        padding: 20px 30px;
        border-radius: 12px;
        width: 400px;
        min-height: 150px;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 25px rgba(182, 190, 190, 0.35);
        text-align: center;
      }

      .close-modal {
        position: absolute;
        top: 8px;
        right: 12px;
        font-size: 22px;
        cursor: pointer;
        user-select: none;
      }

      .loader-box {
        padding: 40px 0;

        padding: 40px 0;
        display: flex;
        justify-content: center;
        background: transparent;
      }

      .details-box img {
        width: 150px;
        border-radius: 8px;
      }

      .details-box p,
      .details-box h2 {
        margin-top: 12px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #Pagination {
        display: flex !important;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin-top: 15px;
      }

      #Pagination button {
        padding: 5px 10px;
        font-size: 14px;
        border: none;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.25);
        color: white;
        cursor: pointer;
        transition: 0.2s;
      }

      #Pagination button:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: scale(1.1);
      }

      #Pagination button:disabled {
        background: #4caf50;
        color: white;
        transform: scale(1);
        cursor: default;
      }
    </style>
  </head>

  <body>
    <div class="wrapper" id="wrapp">
      <div class="dataCard">
        <h1>Movie Search</h1>

        <label>Title:</label>
        <input type="text" id="movieSelect" placeholder="Batman, Avatar..." />
        <div id="noData1" class="error-message">Empty field.</div>

        <label>Type:</label>
        <select id="selectTipe">
          <option value="None">None</option>
          <option value="Movie">Movie</option>
          <option value="Series">Series</option>
          <option value="Episode">Episode</option>
        </select>
        <div id="noData2" class="error-message">No selection.</div>

        <button id="searchBtn">Search</button>
      </div>
      <div class="showCard" id="found" style="display: none">
        <div id="result"></div>
        <div id="Pagination" style="display: none"></div>
        <button id="Close">Close</button>
        <button id="More">More</button>
      </div>
    </div>

    <script type="module">
      class AppDOM {
        constructor() {
          this.wrapper = document.getElementById("wrapp");
          this.movieSelect = document.getElementById("movieSelect");
          this.selectType = document.getElementById("selectTipe");
          this.searchBtn = document.getElementById("searchBtn");
          this.show = document.getElementById("found");
          this.result = document.getElementById("result");
          this.pagination = document.getElementById("Pagination");
          this.moreBtn = document.getElementById("More");
          this.closeBtn = document.getElementById("Close");
          this.nodata1 = document.getElementById("noData1");
          this.nodata2 = document.getElementById("noData2");

          this.loader = document.createElement("div");
          this.loader.className = "loader";
          this.wait = document.createElement("span");
          this.wait.style.color = "#fff";
          this.wait.textContent = "Loading...";
          this.wait.style.display = "none";

          this.wrapper.appendChild(this.loader);
          this.wrapper.appendChild(this.wait);

          this.loader.style.display = "none";
          this.moreBtn.style.display = "none";
        }
      }

      const DOM = new AppDOM();

      let movies = [];
      let perPage = 3;
      let localPage = 1;

      DOM.searchBtn.addEventListener("click", async () => {
        const title = DOM.movieSelect.value.trim();
        const type = DOM.selectType.value;

        if (title === "") {
          DOM.movieSelect.classList.add("error");
          DOM.nodata1.style.display = "block";
          return;
        } else {
          DOM.movieSelect.classList.remove("error");
          DOM.nodata1.style.display = "none";
        }

        if (type === "None") {
          DOM.selectType.classList.add("error");
          DOM.nodata2.style.display = "block";
          return;
        } else {
          DOM.selectType.classList.remove("error");
          DOM.nodata2.style.display = "none";
        }
        async function load() {
          DOM.loader.style.display = "block";
          DOM.wait.style.display = "block";

          await sleep(1000);
          DOM.loader.style.display = "none";
          DOM.wait.style.display = "none";
        }
        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }

        await load();

        const apiKey = "e8e5d3ae";
        const url = `https://www.omdbapi.com/?apikey=${apiKey}&s=${title}&type=${type}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.Response === "False") {
          alert("Фильмы не найдены");
          return;
        }

        movies = data.Search;
        localPage = 1;

        DOM.show.style.display = "block";
        DOM.moreBtn.style.display = "block";

        renderMovies();
        renderPagination();
      });

      function renderPagination() {
        DOM.pagination.innerHTML = "";
        DOM.pagination.style.display = "flex";

        const totalPages = Math.ceil(movies.length / perPage);
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          if (i === localPage) btn.disabled = true;

          btn.addEventListener("click", () => {
            localPage = i;
            renderMovies();
            renderPagination();
          });

          DOM.pagination.appendChild(btn);
        }
      }

      function renderMovies() {
        DOM.result.innerHTML = "";

        const start = (localPage - 1) * perPage;
        const end = start + perPage;
        const pageMovies = movies.slice(start, end);

        pageMovies.forEach((movie) => {
          const block = document.createElement("div");
          block.className = "movie-card";

          const img = document.createElement("img");
          img.src = movie.Poster !== "N/A" ? movie.Poster : "";

          const title = document.createElement("h3");
          title.textContent = movie.Title;

          const year = document.createElement("p");
          year.textContent = "Year: " + movie.Year;

          const type = document.createElement("p");
          type.textContent = "Type: " + movie.Type;

          const detailsBtn = document.createElement("button");
          detailsBtn.textContent = "Details";
          detailsBtn.className = "detailsBtn";

          detailsBtn.addEventListener("click", () => openDetails(movie));

          block.append(img, title, year, type, detailsBtn);
          DOM.result.appendChild(block);
        });
      }

      function openDetails(movie) {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";

        const modal = document.createElement("div");
        modal.className = "modal-window";

        const closeModal = document.createElement("span");
        closeModal.className = "close-modal";
        closeModal.innerHTML = "&times;";
        closeModal.onclick = () => overlay.remove();

        const loaderBox = document.createElement("div");
        loaderBox.className = "loader-box";
        loaderBox.innerHTML = `<div class="loader"></div>`;

        const details = document.createElement("div");
        details.className = "details-box";
        details.style.display = "none";

        details.innerHTML = `
        <img src="${movie.Poster}">
        <div class="detail-content">
          <h2>${movie.Title}</h2>
          <p borderBottom = 15px><strong>Year:</strong> ${movie.Year}</p>
          <p><strong>Type:</strong> ${movie.Type}</p>
          <p><strong>IMDB ID:</strong> ${movie.imdbID}</p>
          <button class="closeDetail">Close</button>
        </div>
      `;
        details.querySelector(".closeDetail").onclick = () => overlay.remove();

        modal.append(closeModal, loaderBox, details);
        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => {
          loaderBox.style.display = "none";
          details.style.display = "block";
        }, 1000);
      }

      DOM.closeBtn.addEventListener("click", () => {
        DOM.show.style.display = "none";
        DOM.pagination.style.display = "none";
      });
    </script>
  </body>
</html>
